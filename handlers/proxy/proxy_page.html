<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f4f8;
            color: #4a5568;
        }
        .container { text-align: center; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.2rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { font-size: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Connecting to remote service...</p>
    </div>
    <form id="auth-form" method="POST" action="{{.AuthEndpoint}}" target="_self">
        <input type="hidden" name="authorization" value="Bearer {{.Token}}">
        <input type="hidden" name="x-proxy-url" value="{{.ServiceURL}}">
    </form>
    <script>
        document.getElementById('auth-form').submit();
    </script>
</body>
</html>
